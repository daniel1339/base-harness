name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  planes:
    name: Planes (obligaciones y medicion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # la medicion saca el colateral de git log

      # La herramienta no vive en este repositorio: se trae en el momento. Asi
      # un arreglo en base-harness llega a todos los proyectos sin tocar
      # ninguno, que es justo lo que una plantilla copiada no consigue.
      #
      # Sin credenciales: el repositorio es publico desde el 2026-08-27. Antes
      # hacia falta un PAT en un secreto, y eso era un paso manual por proyecto
      # que rompia el CI del primer dia si nadie se acordaba.
      - name: Traer base-harness
        run: |
          git clone --depth 1 \
            https://github.com/daniel1339/base-harness.git \
            "$RUNNER_TEMP/base-harness"

      # Las obligaciones de un plan (estimacion, reconocimiento, checklist
      # KISS/DRY/YAGNI, medicion al cerrar) estan escritas en la skill
      # create-plan. Sin esto, quien no la siga se las salta en silencio, y el
      # sintoma aparece meses despues: un plan cerrado sin nada que medir.
      - name: Los planes traen sus obligaciones
        run: |
          "$RUNNER_TEMP/base-harness/bin/base-harness" check
